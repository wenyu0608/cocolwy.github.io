<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f34" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="小红书发布文案的手机复制工作台" />
    <title>小红书手机发帖台</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">PUBLIC MOBILE WORKBENCH</p>
        <h1>小红书手机发帖台</h1>
      </div>
      <button id="share-page" class="round-button" type="button">分享入口</button>
    </header>

    <main class="shell">
      <section class="intro">
        <div>
          <strong>无需 GPT 登录，按段复制</strong>
          <p>选择一篇内容，分别复制标题、正文、标签或单页轮播文案。最终编辑与发送仍由你在小红书完成。</p>
        </div>
        <span id="update-time" class="update-time">正在同步…</span>
      </section>

      <section class="privacy-note">
        <span>公开静态页</span>
        <p>此页面不展示编辑状态或本地源文件路径；只应同步可以进入发布流程的文案。</p>
      </section>

      <label class="search">
        <span class="sr-only">搜索发布包</span>
        <input id="pack-search" type="search" placeholder="搜索待发布内容" autocomplete="off" />
      </label>

      <div id="pack-list" class="pack-list" aria-label="发布包列表"></div>
      <div id="pack-detail" class="pack-detail" aria-live="polite">
        <div class="placeholder">正在读取发布包…</div>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
